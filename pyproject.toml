[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "repo-explainer-agent"
version = "0.1.0"
description = "An agent that explains code repositories."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
repo-explainer = "agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/agent",
  "/src/cli.py",
  "/src/web_app.py",
  "/README.md",
  "/docs",
  "/tests",
  "/sample_repo",
]


